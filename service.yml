name: nginx-proxy
type: service
icon: nginx
title: Nginx Proxy
scalable: true

options:
- version: '1.31'
  tag: 1.31-r1
  default: true
- version: '1.30'
  tag: 1.30-r1
links:
- name: backend
  title: Backend
  required: true
  env:
  - name: NGINX_BACKEND_HOST
    value: '{{link.host}}'
  - name: NGINX_BACKEND_PORT
    value: '{{link.port}}'
  selectors:
  - type: service

endpoints:
- name: http
  ports:
  - name: http
    number: 80
    protocol: http
    main: true

labels:
- nginx
- proxy

configs:
- name: main
  title: Main
  filepath: /etc/gotpl/config/nginx.conf.tmpl
  default:
    source: image
    filepath: /etc/gotpl/config/nginx.conf.tmpl
- name: vhost
  title: Virtual host
  filepath: /etc/gotpl/vhost.conf.tmpl
  default:
    source: image
    filepath: /etc/gotpl/vhost.conf.tmpl

env:
- name: NGINX_VHOST_PRESET
  value: http-proxy

deployment:
  strategy: rolling
  maxUnavailable: 0
  maxSurge: 1
  minReady: 10s
  progressDeadline: 15m
  shutdownGracePeriod: 30s

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/nginx
  chart: oci://registry-1.docker.io/wodby/nginx
  version: 0.4.0

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  helm:
    labels: commonLabels
    annotations: commonAnnotations
    volumes: extraVolumes
  containers:
  - name: nginx
    image: wodby/nginx
    helm:
      resources: resources
      env: extraEnvVars
      mounts: extraVolumeMounts
